image: node:20

stages:
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  paths:
    - .cargo/
    - node_modules/
    - src-tauri/target/

windows-build:
  stage: build
  tags:
    - windows
  script:
    # Install Rust
    - curl -sSf https://sh.rustup.rs | sh -s -- -y
    - set PATH=%PATH%;%USERPROFILE%\.cargo\bin
    # Install npm deps
    - npm install
    # Build frontend
    - npm run build
    # Build Tauri app
    - npm run tauri build
  artifacts:
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 30 days
  only:
    - main
