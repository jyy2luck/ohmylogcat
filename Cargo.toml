[package]
name = "ohmylogcat"
version = "0.1.0"
description = "A lightweight Android Logcat viewer"
authors = ["you"]
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
