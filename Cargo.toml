[package]
name = "ohmylogcat"
version = "0.1.0"
description = "A lightweight Android Logcat viewer"
authors = ["you"]
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
